<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gateway Games</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons for sidebar navigation -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  />
</head>
<body>
  <div class="app-container">
    <!-- Icon-Only Sidebar Navigation -->
    <nav class="sidebar">
      <div class="logo-icon" title="Gateway Games">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <ul class="nav-links">
        <li class="active" title="Home">
          <a href="#"><i class="fa-solid fa-house"></i></a>
        </li>
        <li title="Library / Games">
          <a href="#"><i class="fa-solid fa-gamepad"></i></a>
        </li>
        <li title="Favorites">
          <a href="#"><i class="fa-solid fa-bookmark"></i></a>
        </li>
        <li title="Settings">
          <a href="#"><i class="fa-solid fa-gear"></i></a>
        </li>
      </ul>
    </nav>

    <!-- Centered Content Area -->
    <main class="content-wrapper">
      <header class="header">
        <h1>Gateway Games</h1>
        <p>Select a game to launch directly</p>
      </header>

      <!-- Centered Game Grid -->
      <section class="game-grid" id="gameGrid">
        <!-- Game Cards will dynamically populate here -->
      </section>

      <!-- Game Player Modal/Frame -->
      <div class="player-modal" id="playerModal">
        <button class="close-btn" id="closeBtn">&times;</button>
        <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
